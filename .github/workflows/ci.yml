name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      # tests/typeset.rs measures in the font the driver will measure in, which
      # means reading cmr10.tfm and cmsy10.tfm off a real installation:
      # `find_font` asks `kpsewhich` and then walks the texmf trees, and on a
      # runner with neither it answers None and thirteen tests panic before
      # they assert anything. texlive-base carries both metrics and pulls
      # texlive-binaries for `kpsewhich`, which is the whole of what is needed
      # -- no formats, no engines, ~44 MB.
      - name: Install TeX font metrics
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-base
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The release job builds with --locked, so a Cargo.lock that does not
      # record the version in Cargo.toml fails THERE and nowhere else -- after
      # the tag exists, which strands the release: no artifacts, no GitHub
      # release, and the Homebrew tap left on the previous version. That is
      # what happened to v0.3.1. Checking it here fails on main instead, while
      # the fix is still a commit rather than a re-tag.
      - name: Lockfile is current
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose

  # The shape gates, ported from the sibling engines. Each one is a small
  # shell audit over the tree's own docs, man pages, README and workflows;
  # they run separately from the Rust job so a formatting failure and a
  # broken link are two different red X's rather than one.
  docs-gates:
    name: Docs gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/docs-target-blank-rel-noopener.sh
      - run: bash tests/docs-no-http-links.sh
      - run: bash tests/docs-no-inline-handlers.sh
      - run: bash tests/docs-has-h1.sh
      - run: bash tests/docs-no-deprecated-tags.sh
      - run: bash tests/docs-no-placeholder-href.sh
      - run: bash tests/docs-has-html-closing.sh
      - run: bash tests/docs-has-body-tag.sh

  polish-gates:
    name: Polish gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/man-page-no-trailing-whitespace.sh
      - run: bash tests/man-page-final-newline.sh
      - run: bash tests/man-page-synopsis-section.sh
      - run: bash tests/tests-shell-executable.sh
      - run: bash tests/tests-shell-shebang.sh

  newline-gates:
    name: Newline + README gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/readme-final-newline.sh
      - run: bash tests/docs-final-newline.sh
      - run: bash tests/workflow-final-newline.sh
      - run: bash tests/cargo-final-newline.sh
      - run: bash tests/readme-has-https-link.sh
      - run: bash tests/readme-has-h2-section.sh
      - run: bash tests/readme-has-badges.sh
      - run: bash tests/workflow-no-tabs.sh
