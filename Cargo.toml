[package]
name = "texrs"
version = "0.5.0"
edition = "2021"
authors = ["MenkeTechnologies <linux.dev25@gmail.com>"]
description = "A TeX engine: Knuth's mouth and expander, lowered for a bytecode VM"
license = "MIT"
repository = "https://github.com/MenkeTechnologies/texrs"
homepage = "https://menketechnologies.github.io/texrs/"
documentation = "https://docs.rs/texrs"
readme = "README.md"
keywords = ["tex", "typesetting", "macro", "expander", "fusevm"]
categories = ["command-line-utilities", "text-processing"]
# Dev-only trees kept out of the published crate: consumers get src and the
# `texrs` binary, not the differential corpus, the fuzz harness, the parity
# scripts or CI config.
#
# `/tests/` is NOT excluded wholesale, and the reason is load-bearing:
# `src/docs.rs` does `include_str!("../tests/known_gaps.txt")`, so that one
# file is compiled INTO the crate. Excluding it made `cargo publish` fail at
# the verify step -- "couldn't read src/../tests/known_gaps.txt" -- which is
# a packaging break nothing in a normal build or test run can see, because
# every one of those reads the file from the repo where it is still there.
# The parts of `/tests/` that are genuinely dev-only are named instead.
exclude = [
    "/.github/",
    "/tests/cases/",
    "/tests/common/",
    "/tests/data/",
    "/tests/*.rs",
    "/tests/*.sh",
    "/fuzz/",
    "/scripts/",
    "/docs/",
    "/BUGS.md",
]

[[bin]]
name = "dvi-parity"
path = "src/bin/dvi_parity.rs"

[[bin]]
name = "pdf-parity"
path = "src/bin/pdf_parity.rs"

[[bin]]
name = "texrs"
path = "src/main.rs"

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[[bin]]
name = "parity-fuzz"
path = "src/bin/parity_fuzz.rs"

[[bin]]
name = "gen-docs"
path = "src/bin/gen_docs.rs"

[[bin]]
name = "gen-emacs-stdlib"
path = "src/bin/gen_emacs_stdlib.rs"

[lib]
name = "texrs"
path = "src/lib.rs"
# staticlib so an AOT object can be linked against the texrs runtime (the
# `fusevm_aot_register_builtins` hook in src/aot_runtime.rs plus fusevm's AOT
# runtime) into a standalone native executable via `texrs --aot`.
crate-type = ["rlib", "staticlib"]

[dependencies]
fusevm = { version = "0.26.0", features = ["jit", "jit-disk-cache", "aot", "ffi"] }

# LSP (`texrs --lsp`) over stdio, the same pair every sibling frontend speaks it
# with. libc is the orphan guard: a language server whose editor died must exit
# rather than linger.
lsp-server = "0.7.9"
lsp-types = "0.97.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The document model (src/document.rs): Texrs.toml, ported in shape from
# tectonic's docmodel.
toml = "0.8"
libc = "0.2"

# Glob matching for `\intercept` patterns (src/intercepts.rs), the same crate
# the sibling engines match their function/method intercepts with.
glob = "0.3"

# Input digests (src/io.rs): what a run read, recorded so a cache keyed on more
# than one file can say whether it is still valid.
sha2 = "0.10"

# The interactive prompt (`texrs --repl`), the same line editor the sibling
# frontends' REPLs use: history in ~/.texrs/history and Tab completion over the
# primitive corpus. nu-ansi-term paints the prompt; the home comes from `dirs`,
# which the cache already depends on.
reedline = "0.47.0"
nu-ansi-term = "0.50"

# The rkyv bytecode cache, the same shard format the sibling engines write
# (zshrs ZRSC, awkrs AWKR, vimlrs VIML, elisprs ELSP) under texrs's own TEXR
# magic — pinned to the version and features they serialize with, or a shard one
# of them wrote could not be validated by the others' tools.
# Paragraph-parallel line breaking. A paragraph is broken independently of its
# neighbours -- the measure is the same for all of them and no state crosses the
# blank line between two -- so the work fans out with nothing to synchronise.
rayon = "1"
rkyv = { version = "0.7", features = ["validation", "archive_le", "size_32"] }
memmap2 = "0.9"
# The inner blob of a cache entry: a bincode-encoded fusevm::Chunk.
bincode = "1.3"
# flock for the writer lock, so two texrs runs cannot interleave a shard write.
nix = { version = "0.29", features = ["fs"] }
dirs = "5"
once_cell = "1"
# Bundles (src/bundle.rs): a document's support files as one archive, the
# local half of tectonic's `bundles`. Deflate only — a bundle is read, never
# written, and every other codec zip can carry is one more thing to keep
# building in ten years.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Taking a PNG's pixels apart (src/image.rs). A picture goes into a PDF
# without being decoded -- PDF's compressions are PNG's -- except when it
# carries an alpha channel, which PDF wants as a separate soft mask where PNG
# interleaves it with the colour. That one case means inflating the pixels,
# undoing PNG's row filters, splitting them and deflating both halves. flate2
# is already in the tree beneath zip; this makes it a dependency in its own
# right rather than borrowing one.
flate2 = "1"
# Fetching a bundle (src/geturl.rs), the other half of tectonic's `bundles`.
# ureq rather than reqwest: a blocking client is what a one-shot download wants,
# and rustls with webpki-roots means no system OpenSSL to keep working. Fetching
# happens ONLY on `-X bundle fetch` — never inside a build.
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }

[[bench]]
name = "pipeline"
harness = false

[dev-dependencies]
# The DAP integration test writes a document to a scratch directory and points
# the adapter at it by path.
tempfile = "3"
# The benchmarks; `cargo bench` only.
criterion = "0.5"

# texrs is a standalone crate, not a workspace member. An explicit empty
# `[workspace]` stops cargo walking up to the MenkeTechnologiesMeta parent, and
# keeps `fuzz/` (which has its own) out of this one.
[workspace]
