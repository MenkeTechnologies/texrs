[package]
name = "texrs"
version = "0.1.0"
edition = "2021"
authors = ["MenkeTechnologies <linux.dev25@gmail.com>"]
description = "A TeX engine: Knuth's mouth and expander, lowered for a bytecode VM"
license = "MIT"
repository = "https://github.com/MenkeTechnologies/texrs"
homepage = "https://menketechnologies.github.io/texrs/"
documentation = "https://docs.rs/texrs"
readme = "README.md"
keywords = ["tex", "typesetting", "macro", "expander", "fusevm"]
categories = ["command-line-utilities", "text-processing"]
# Dev-only trees kept out of the published crate: consumers get src and the
# `texrs` binary, not the differential corpus, the fuzz harness, the parity
# scripts or CI config. Nothing here is referenced at compile time (no
# include_str! into any of it), so the packaged crate still builds.
exclude = [
    "/.github/",
    "/tests/",
    "/fuzz/",
    "/scripts/",
    "/docs/",
    "/BUGS.md",
]

[[bin]]
name = "texrs"
path = "src/main.rs"

[lib]
name = "texrs"
path = "src/lib.rs"

[dependencies]
fusevm = { version = "0.26.0", features = ["jit", "jit-disk-cache"] }

# The rkyv bytecode cache, the same shard format the sibling engines write
# (zshrs ZRSC, awkrs AWKR, vimlrs VIML, elisprs ELSP) under texrs's own TEXR
# magic — pinned to the version and features they serialize with, or a shard one
# of them wrote could not be validated by the others' tools.
rkyv = { version = "0.7", features = ["validation", "archive_le", "size_32"] }
memmap2 = "0.9"
# The inner blob of a cache entry: a bincode-encoded fusevm::Chunk.
bincode = "1.3"
# flock for the writer lock, so two texrs runs cannot interleave a shard write.
nix = { version = "0.29", features = ["fs"] }
dirs = "5"
once_cell = "1"

# texrs is a standalone crate, not a workspace member. An explicit empty
# `[workspace]` stops cargo walking up to the MenkeTechnologiesMeta parent, and
# keeps `fuzz/` (which has its own) out of this one.
[workspace]
