pluginGroup=com.menketechnologies.texrs
pluginName=texrs-intellij
pluginRepositoryUrl=https://github.com/MenkeTechnologies/texrs

# Bumped in lockstep with texrs Cargo.toml
pluginVersion=0.5.0

# Supported IDE range. 2025.2 = build 252, 2026.1 = build 261. The platform
# LSP API is paid-IDE only, so this plugin needs one — the same requirement the
# sibling plugins carry.
pluginSinceBuild=252
pluginUntilBuild=261.*

# IU: the LSP client compiles against com.intellij.platform.lsp, which the
# Community SDK does not carry.
platformType=IU
platformVersion=2025.2

# JVM
javaVersion=17

# JVM used by Gradle. Picks up `$JAVA_HOME` from the environment by default
# (which `actions/setup-java@v4` exports in CI). DO NOT hardcode an absolute
# path here — a committed `/Users/<you>/...` path breaks every other machine.
#
# Multi-JDK local dev: if `java -version` reports the wrong one, set
#   org.gradle.java.home=/abs/path/to/jdk17
# in your USER-level `~/.gradle/gradle.properties` instead of here. Kotlin
# 2.0.21 (pinned by the IntelliJ Platform Gradle Plugin) cannot parse the
# three-part version string of newer JDKs, so JDK 17 is required.

kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC
